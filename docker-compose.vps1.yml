version: '3.8'

# ======================================================
# VPS1 – Public Node
# Services: nginx, frontend, api-gateway
# Expects VPS2 services reachable at BACKEND_HOST
# ======================================================

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - public-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - API_GATEWAY_URL=http://api-gateway:4000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-gateway
    networks:
      - public-net
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - PLAYER_SERVICE_URL=http://${BACKEND_HOST}:5000
      - GAME_SERVICE_URL=http://${BACKEND_HOST}:6100
      - WALLET_SERVICE_URL=http://${BACKEND_HOST}:7000
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    networks:
      - public-net
    restart: unless-stopped

networks:
  public-net:
    driver: bridge
