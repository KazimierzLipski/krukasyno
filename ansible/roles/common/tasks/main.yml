---
# Common role – system hardening and base packages

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - fail2ban
      - unattended-upgrades
      - rsync
    state: present

- name: Configure UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Configure UFW — allow HTTP (VPS1 only)
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: inventory_hostname in groups['vps1']

- name: Configure UFW — allow HTTPS (VPS1 only)
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
  when: inventory_hostname in groups['vps1']

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable unattended upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
